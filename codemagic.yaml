workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      xcode: latest
    scripts:
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Fix NDK 27 and SDK 35
        script: |
          ls android/app/
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties
          cat android/local.properties
          # Fix both old and new Gradle files
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Fixing $f"
              sed -i '' 's/flutter.compileSdkVersion/35/g' "$f" || sed -i 's/flutter.compileSdkVersion/35/g' "$f" || true
              sed -i '' 's/flutter.minSdkVersion/24/g' "$f" || sed -i 's/flutter.minSdkVersion/24/g' "$f" || true
              sed -i '' 's/flutter.ndkVersion/\"27.0.12077973\"/g' "$f" || sed -i 's/flutter.ndkVersion/\"27.0.12077973\"/g' "$f" || true
            fi
          done
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
