workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Fix and Build
        script: |
          flutter create --org com.blendjam --project-name blendjam --platforms android .
          echo "sdk.dir=/Users/builder/programs/android-sdk" > android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.ndkVersion=26.3.11579264" >> android/local.properties
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
