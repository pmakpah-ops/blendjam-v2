workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      xcode: latest
    scripts:
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Fix Android SDK to 35
        script: |
          sed -i '' 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i '' 's/minSdk 21/minSdk 24/g' android/app/build.gradle || true
          sed -i '' 's/flutter.minSdkVersion/24/g' android/app/build.gradle || true
          sed -i '' 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i '' 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle || true
          sed -i '' 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i '' 's/targetSdk flutter.targetSdkVersion/targetSdk 35/g' android/app/build.gradle || true
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
