workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
    scripts:
      - name: Fix broken Gradle project
        script: |
          rm -rf android
          flutter create --org com.blendjam --project-name blendjam --platforms android . --overwrite
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
