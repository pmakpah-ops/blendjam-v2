workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create android folder
        script: flutter create --org com.blendjam --project-name blendjam --platforms android . --overwrite
      - name: Build APK
        script: flutter build apk --release --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
