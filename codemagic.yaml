workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      xcode: latest
    scripts:
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Fix NDK + Icon
        script: |
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties
          cat android/local.properties
          # Copy your 31KB icon to all densities
          if [ -f "assets/icon.png" ]; then
            echo "Found assets/icon.png - installing"
            for d in android/app/src/main/res/mipmap-*; do
              cp assets/icon.png $d/ic_launcher.png
              cp assets/icon.png $d/launcher_icon.png
              cp assets/icon.png $d/ic_launcher_round.png 2>/dev/null || true
            done
            ls -lh android/app/src/main/res/mipmap-xxxhdpi/
          else
            echo "ERROR: assets/icon.png not found"
            ls assets/
          fi
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
