workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      xcode: latest
    scripts:
      - name: Create
        script: |
          flutter create --org com.blendjam --project-name blendjam --platforms android .
          cat > android/local.properties <<'EOF'
          sdk.dir=/Users/builder/programs/android-sdk
          flutter.minSdkVersion=24
          flutter.compileSdkVersion=35
          flutter.targetSdkVersion=35
          flutter.ndkVersion=26.3.11579264
          EOF
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do cp assets/icon.png "$d/ic_launcher.png" 2>/dev/null; cp assets/icon.png "$d/ic_launcher_round.png" 2>/dev/null; done
          # Only force compileSdk to 35 without breaking syntax
          sed -i '' 's/flutter.compileSdkVersion/35/g' android/app/build.gradle
          sed -i '' 's/flutter.targetSdkVersion/35/g' android/app/build.gradle
          sed -i '' 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          sed -i '' 's/flutter.ndkVersion/"26.3.11579264"/g' android/app/build.gradle
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
