workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Build
        script: |
          flutter create --org com.blendjam --project-name blendjam --platforms android .
          printf "sdk.dir=/Users/builder/programs/android-sdk\nflutter.compileSdkVersion=35\nflutter.targetSdkVersion=35\nflutter.minSdkVersion=24\nflutter.ndkVersion=26.3.11579264\n" > android/local.properties
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
