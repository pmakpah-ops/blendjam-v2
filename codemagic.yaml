workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      xcode: latest
    cache:
      cache_paths: []
    scripts:
      - name: Clean
        script: flutter clean
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android. --overwrite
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
