workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      xcode: latest
    scripts:
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Fix minSdk to 24
        script: |
          sed -i '' 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i '' 's/minSdk 21/minSdk 24/g' android/app/build.gradle || true
          sed -i '' 's/flutter.minSdkVersion/24/g' android/app/build.gradle || true
          sed -i '' 's/flutter.minSdkVersion/24/g' android/local.properties || true
          cat android/app/build.gradle | grep -i minsdk
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
