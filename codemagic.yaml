workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
    cache:
      cache_paths: []
    scripts:
      - name: Fix broken Gradle project
        script: |
          rm -rf android
          flutter create --org com.blendjam --project-name blendjam --platforms=android . --overwrite
          echo "=== NEW android files ==="
          ls -l android/
          cat android/settings.gradle
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release -v
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
