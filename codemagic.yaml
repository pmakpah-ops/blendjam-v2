workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      xcode: latest
    scripts:
      - name: Create Android
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Fix NDK 27 and SDK 35
        script: |
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          t = t.replace('flutter.compileSdkVersion','35')
          t = t.replace('flutter.targetSdkVersion','35')
          t = t.replace('flutter.minSdkVersion','24')
          t = t.replace('flutter.ndkVersion','\"27.0.12077973\"')
          if 'ndkVersion' not in t:
              t = t.replace('compileSdk 35', 'ndkVersion = \"27.0.12077973\"\n        compileSdk 35')
          p.write_text(t)
          print(t[:2000])
          "
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
