      - name: HARDCODE NDK + FIX ICON
        script: |
          python3 << 'PY'
          import pathlib, re
          lp = pathlib.Path("android/local.properties")
          t = re.sub(r'.*ndk.*\n', '', lp.read_text(), flags=re.I)
          t += "\nflutter.ndkVersion=27.0.12077973\n"
          lp.write_text(t)
          for fp in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = pathlib.Path(fp)
              if not p.exists(): continue
              txt = p.read_text()
              txt = re.sub(r'ndkVersion\s*=\s*.*', ' ndkVersion = "27.0.12077973"', txt)
              txt = re.sub(r'ndkVersion\s+.*', ' ndkVersion = "27.0.12077973"', txt)
              if '27.0.12077973' not in txt:
                  txt = txt.replace("android {", 'android {\n ndkVersion = "27.0.12077973"')
              p.write_text(txt)
          PY

          # --- ICON FIX: delete adaptive XML that hides your PNG ---
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml

          # Now copy your icon to ALL folders
          for d in android/app/src/main/res/mipmap-*; do
            cp assets/icon.png $d/ic_launcher.png
            cp assets/icon.png $d/ic_launcher_round.png
            cp assets/icon.png $d/launcher_icon.png
          done

          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" > /dev/null
