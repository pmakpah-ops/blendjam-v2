workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      xcode: latest
    scripts:
      - name: Create Android
        script: |
          flutter create --org com.blendjam --project-name blendjam --platforms android .
          # Install required NDK 27
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
      - name: Fix NDK + Icon
        script: |
          # Clean old NDK settings
          sed -i '' '/ndk/d' android/local.properties 2>/dev/null || sed -i '/ndk/d' android/local.properties
          sed -i '' '/NDK/d' android/local.properties 2>/dev/null || sed -i '/NDK/d' android/local.properties
          
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.ndkVersion=27.0.12077973" >> android/local.properties
          
          # FORCE in build.gradle too (this is the key fix)
          sed -i '' 's/ndkVersion.*/ndkVersion "27.0.12077973"/' android/app/build.gradle 2>/dev/null || sed -i 's/ndkVersion.*/ndkVersion "27.0.12077973"/' android/app/build.gradle
          # If ndkVersion line doesn't exist, add it
          if ! grep -q "ndkVersion" android/app/build.gradle; then
            sed -i '' '/android {/a\
            ndkVersion "27.0.12077973"
          ' android/app/build.gradle 2>/dev/null || sed -i '/android {/a ndkVersion "27.0.12077973"' android/app/build.gradle
          fi
          
          cat android/local.properties
          cat android/app/build.gradle | grep -A2 -B2 ndk
          
          # Your 31KB icon
          if [ -f "assets/icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp assets/icon.png $d/ic_launcher.png
              cp assets/icon.png $d/launcher_icon.png
            done
            echo "Icon installed"
          fi
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
