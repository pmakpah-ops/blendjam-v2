workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      xcode: latest
    scripts:
      - name: Create
        script: flutter create --org com.blendjam --project-name blendjam --platforms android .
      - name: Pub get
        script: flutter pub get
      - name: HARDCODE NDK 27 - Final fix
        script: |
          # Show what we have now
          ls android/app/
          cat android/app/build.gradle.kts | grep -n ndk || echo "no ndk line in kts"
          cat android/app/build.gradle | grep -n ndk || echo "no ndk line in gradle"

          python3 << 'PY'
          import pathlib, re
          # Force local.properties
          lp = pathlib.Path("android/local.properties")
          t = lp.read_text()
          t = re.sub(r'.*ndk.*\n', '', t, flags=re.I)
          t += "\nflutter.ndkVersion=27.0.12077973\n"
          lp.write_text(t)
          
          # Force BOTH files with HARDCODED 27
          for fp in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = pathlib.Path(fp)
              if not p.exists():
                  continue
              txt = p.read_text()
              # Replace ANY ndkVersion line with hardcoded 27
              txt = re.sub(r'ndkVersion\s*=\s*.*', '    ndkVersion = "27.0.12077973"', txt)
              txt = re.sub(r'ndkVersion\s+.*', '    ndkVersion = "27.0.12077973"', txt)
              # If still no ndkVersion, inject it after android {
              if '27.0.12077973' not in txt:
                  txt = txt.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"')
              p.write_text(txt)
              print(f"--- {fp} FIXED ---")
              print([l for l in txt.splitlines() if "ndk" in l.lower()])
          
          # Extra: force in gradle.properties too
          gp = pathlib.Path("android/gradle.properties")
          gptxt = gp.read_text() if gp.exists() else ""
          gptxt += "\nandroid.ndkVersion=27.0.12077973\n"
          gp.write_text(gptxt)
          PY

          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
      - name: Build APK
        script: |
          cat android/app/build.gradle.kts | grep ndk
          cat android/local.properties | grep ndk
          flutter build apk --release --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
