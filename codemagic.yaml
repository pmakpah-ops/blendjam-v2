workflows:
  blendjam-v2:
    name: blendjam-v2
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      xcode: latest
    scripts:
      - name: Create
        script: |
          flutter create --org com.blendjam --project-name blendjam --platforms android .
          printf "sdk.dir=/Users/builder/programs/android-sdk\nflutter.minSdkVersion=24\nflutter.compileSdkVersion=35\nflutter.targetSdkVersion=35\nflutter.ndkVersion=26.3.11579264\n" > android/local.properties
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
      - name: Force SDK 35
        script: |
          python3 -c "
          import pathlib
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          t=t.replace('flutter.compileSdkVersion','35').replace('flutter.targetSdkVersion','35').replace('flutter.minSdkVersion','24').replace('flutter.ndkVersion','\"26.3.11579264\"')
          p.write_text(t)
          print(t[:1000])
          "
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
