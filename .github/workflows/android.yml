name: Build APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flutter project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name blendjam \
            .

      - name: Configure Android build and TensorFlow Lite rules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          lines = gradle.read_text().splitlines()

          # Remove old NDK assignments and set the required version inside android {}.
          lines = [line for line in lines if "ndkVersion =" not in line]
          android_index = next((i for i, line in enumerate(lines) if line.strip() == "android {"), None)
          if android_index is None:
              raise SystemExit("Could not find android block in build.gradle.kts")
          lines.insert(android_index + 1, '    ndkVersion = "27.0.12077973"')
          lines = [
              line.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              for line in lines
          ]

          # Ensure R8 receives a narrow rule for the missing optional GPU class.
          release_index = next((i for i, line in enumerate(lines) if line.strip() == "release {"), None)
          if release_index is None:
              raise SystemExit("Could not find release buildType in build.gradle.kts")
          release_end = next(
              (i for i in range(release_index + 1, len(lines)) if lines[i] == "        }"),
              None
          )
          if release_end is None:
              raise SystemExit("Could not find end of release buildType")
          if not any("proguardFiles(" in line for line in lines[release_index:release_end]):
              lines.insert(
                  release_end,
                  '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              )

          gradle.write_text("\n".join(lines) + "\n")
          Path("android/app/proguard-rules.pro").write_text(
              "-dontwarn org.tensorflow.lite.gpu.GpuDelegateFactory$Options\n"
          )

          check = gradle.read_text()
          if 'ndkVersion = "27.0.12077973"' not in check or "minSdk = 24" not in check:
              raise SystemExit("Android SDK settings were not applied")
          print("Android NDK, minimum SDK, and R8 rules configured.")
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Generate app icon
        run: |
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blendjam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
