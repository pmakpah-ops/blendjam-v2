name: Build APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flutter project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name blendjam \
            .

      - name: Configure Android build and TensorFlow Lite rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          content = gradle.read_text()

          # Set the NDK directly inside the android block, removing any
          # previous ndkVersion assignment first so there is only one value.
          content = re.sub(r'^\\s*ndkVersion\\s*=.*\\n', '', content, flags=re.M)
          if not re.search(r'^android\\s*\\{', content, flags=re.M):
              raise SystemExit("Could not find android block in build.gradle.kts")
          content = re.sub(
              r'^(android\\s*\\{)',
              r'\\1\\n    ndkVersion = "27.0.12077973"',
              content,
              count=1,
              flags=re.M
          )
          content = content.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 24"
          )

          # Add the narrow missing-class rule to the release shrinker config.
          match = re.search(r'release\\s*\\{', content)
          if not match:
              raise SystemExit("Could not find release buildType in build.gradle.kts")
          closing = content.find("\\n        }", match.end())
          if closing < 0:
              raise SystemExit("Could not find end of release buildType")
          release_block = content[match.end():closing]
          if "proguardFiles(" not in release_block:
              content = (
                  content[:closing]
                  + '\\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                  + content[closing:]
              )

          gradle.write_text(content)
          Path("android/app/proguard-rules.pro").write_text(
              "-dontwarn org.tensorflow.lite.gpu.GpuDelegateFactory$Options\\n"
          )

          check = gradle.read_text()
          if 'ndkVersion = "27.0.12077973"' not in check:
              raise SystemExit("NDK 27 configuration was not applied")
          if "minSdk = 24" not in check:
              raise SystemExit("minSdk 24 configuration was not applied")
          print("Android build configuration verified.")
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Generate app icon
        run: |
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blendjam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
