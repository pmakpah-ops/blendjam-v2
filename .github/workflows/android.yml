name: Build APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flutter project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name blendjam \
            .

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          lines = gradle.read_text().splitlines()

          # Set the NDK explicitly in the generated Android block.
          lines = [line for line in lines if "ndkVersion =" not in line]
          android_index = next((i for i, line in enumerate(lines) if line.strip() == "android {"), None)
          if android_index is None:
              raise SystemExit("Could not find android block in build.gradle.kts")
          lines.insert(android_index + 1, '    ndkVersion = "27.0.12077973"')
          lines = [
              line.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              for line in lines
          ]
          gradle.write_text("\n".join(lines) + "\n")

          check = gradle.read_text()
          if 'ndkVersion = "27.0.12077973"' not in check or "minSdk = 24" not in check:
              raise SystemExit("Android SDK settings were not applied")
          print("Android NDK 27 and minSdk 24 configured.")
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Generate app icon
        run: |
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blendjam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
